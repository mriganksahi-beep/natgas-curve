name: Live tests winter 2026-27

# Saturdays 14:00 UTC: Friday's close is final; weather for the week is mostly in.
on:
  schedule:
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt yfinance
      - run: python -m src.live2627
      - name: Commit results
        run: |
          git config user.name "live-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/live_2026_27
          if git diff --cached --quiet; then echo "Nothing to commit"; else
            git commit -m "Live tests 2026-27 $(date -u +%Y-%m-%d)" && git pull --rebase -q && git push; fi
