name: Weekly live storage forecast

# Wednesdays 12:00 UTC: always before EIA's release (normally Thursday 10:30 ET;
# holiday weeks move it to Wednesday noon ET at the earliest).
on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m src.live auto
      - name: Commit forecast
        run: |
          git config user.name "live-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/live_forecasts.csv reports/live_end_of_season.csv data/raw/storage.csv data/raw/eia_futures_c1_c4.csv data/raw/henry_hub_spot.csv data/raw/weekly_degree_days_live.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to commit"; else
            git commit -m "Live forecast $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
